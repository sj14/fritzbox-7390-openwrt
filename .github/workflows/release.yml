# Builds the image to pass on (RELEASE_IMAGE=1 in kernel/build.sh, without
# AVM's files) for a new tag or a published release, and attaches it to the
# tag's release, together with its SHA256, the list of OpenWrt packages in it
# and the EVA tool that flashes it. The README's "Installing" starts from these
# files.
name: Release image

on:
  push:
    tags: ["*"]
  release:
    types: [published]

# "shell: bash" makes GitHub run each step with -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-26.04
    # The first build compiles the MIPS cross compiler.
    timeout-minutes: 360
    permissions:
      contents: write
    # A release made in the web interface may bring both events for one tag;
    # the later run replaces the earlier one.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # The build needs about 9 to 12 GB at its peak: 3.3 GB in kernel/build,
      # 2.8 GB of Nix store for kernel/shell.nix, and while Nix compiles the
      # cross GCC its build directory and sources. A runner has 14 GB, of which
      # the preinstalled tools take part, so these unused ones go. The df lines
      # show how much was needed.
      - name: Make room on the disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: cachix/install-nix-action@v31

      # kernel/shell.nix brings every tool, also those that OpenWrt's
      # ImageBuilder expects on the host; --pure keeps the runner's own out.
      - name: Build the OpenWrt files
        working-directory: kernel
        run: |
          mkdir -p build
          nix-shell --pure --run "tools/fetch-openwrt-rootfs.sh build/openwrt" | tee build/fetch-openwrt-rootfs.log
          grep '^OPENWRT_ROOTFS=' build/fetch-openwrt-rootfs.log >> "$GITHUB_ENV"

      - name: Build the image
        working-directory: kernel
        env:
          RELEASE_IMAGE: "1"
        run: |
          nix-shell --pure --keep RELEASE_IMAGE --keep OPENWRT_ROOTFS --run ./build.sh
          df -h /

      - name: Attach the image to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=fritzbox-7390-openwrt-$TAG
          mkdir release
          cp kernel/build/fritzbox-7390-flash.bin "release/$name.bin"
          cp kernel/build/openwrt/packages.manifest "release/$name.manifest"
          cp kernel/tools/eva-ramboot.py release/eva-ramboot.py
          (cd release && sha256sum "$name.bin" > "$name.bin.sha256")
          if ! gh release view "$TAG" > /dev/null 2>&1; then
              gh release create "$TAG" --verify-tag --title "$TAG" \
                  --notes "OpenWrt for the FRITZ!Box 7390, without AVM's files. How to install it: see \"Installing\" in the README."
          fi
          gh release upload "$TAG" release/* --clobber
