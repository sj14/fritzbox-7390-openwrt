# Builds the image to pass on (RELEASE_IMAGE=1 in kernel/build.sh, without
# AVM's files) for a published release and attaches it to the release,
# together with its SHA256, the list of OpenWrt packages in it
# and the EVA tool that flashes it. The README's "Installing" starts from these
# files.
name: Release image

on:
  release:
    types: [published]

# "shell: bash" makes GitHub run each step with -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-26.04
    # The first build compiles the MIPS cross compiler.
    timeout-minutes: 360
    permissions:
      contents: write
      # For cache-nix-action to remove its older caches.
      actions: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # The Nix store of an earlier run, so that only the first run, and one after
      # a change of kernel/*.nix, compiles the cross compiler. kernel/shell.nix
      # needs about 2.8 GB of it.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('kernel/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      # kernel/shell.nix brings every tool, also those that OpenWrt's
      # ImageBuilder expects on the host; --pure keeps the runner's own out.
      - name: Build the OpenWrt files
        working-directory: kernel
        run: |
          mkdir -p build
          nix-shell --pure --run "tools/fetch-openwrt-rootfs.sh build/openwrt" | tee build/fetch-openwrt-rootfs.log
          grep '^OPENWRT_ROOTFS=' build/fetch-openwrt-rootfs.log >> "$GITHUB_ENV"

      - name: Build the image
        working-directory: kernel
        env:
          RELEASE_IMAGE: "1"
        run: nix-shell --pure --keep RELEASE_IMAGE --keep OPENWRT_ROOTFS --run ./build.sh

      - name: Attach the image to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=fritzbox-7390-openwrt-$TAG
          mkdir release
          cp kernel/build/fritzbox-7390-flash.bin "release/$name.bin"
          cp kernel/build/openwrt/packages.manifest "release/$name.manifest"
          cp kernel/tools/eva-ramboot.py release/eva-ramboot.py
          (cd release && sha256sum "$name.bin" > "$name.bin.sha256")
          gh release upload "$TAG" release/* --clobber
